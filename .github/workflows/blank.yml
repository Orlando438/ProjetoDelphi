name: Analisar diff com ChatGPT

on:
  push:
    branches:
      - main

jobs:
  chatgpt-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2  # necessário para git diff HEAD^ HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Definir variável de ambiente
        run: echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV

      - name: Analisar diff com ChatGPT
        run: npm run analisar
